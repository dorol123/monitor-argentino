name: Keep Render app awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /healthz
        run: |
          code=$(curl -sS --max-time 60 -o /dev/null -w "%{http_code}" https://monitor-argentino.onrender.com/healthz)
          echo "healthz respondió $code"
          if [ "$code" != "200" ]; then
            echo "::warning::/healthz no respondió 200 (respondió $code) — el servicio puede estar arrancando en frío, no falla el job por esto."
          fi
