<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor Argentino — Acceso</title>
<style>
  :root { --bg: #0b1220; --bg-alt: #0f1b2d; --panel: #101c30; --border: #1e2c42; --text: #e7ecf5; --text-dim: #8b98ac; --accent: #34d399; --accent-dim: #10b981; --red: #f87171; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, var(--bg) 0%, var(--bg-alt) 100%);
    color: var(--text);
  }
  form {
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 32px 28px; width: 100%; max-width: 320px; text-align: center;
  }
  h1 { font-size: 1.1rem; margin: 0 0 4px; }
  p.sub { color: var(--text-dim); font-size: 0.8rem; margin: 0 0 20px; }
  input {
    width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
    padding: 12px 14px; border-radius: 10px; font-size: 1.1rem; text-align: center;
    letter-spacing: 0.3em; outline: none; margin-bottom: 14px;
  }
  input:focus { border-color: var(--accent-dim); }
  button {
    width: 100%; background: var(--accent-dim); color: #04201a; border: none;
    padding: 12px; border-radius: 10px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
  }
  .error { color: var(--red); font-size: 0.8rem; margin: 0 0 14px; }
</style>
</head>
<body>
  <form method="POST" action="/login">
    <h1>Monitor Argentino</h1>
    <p class="sub">Ingresá la clave para continuar</p>
    <p class="error" id="error" style="display:none">Clave incorrecta</p>
    <input type="password" name="password" inputmode="numeric" autocomplete="current-password" autofocus required />
    <button type="submit">Entrar</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).has('error')) {
      document.getElementById('error').style.display = 'block';
    }
  </script>
</body>
</html>
